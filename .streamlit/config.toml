# Tema fijo en claro: los gráficos de charts.py están calibrados sobre fondo
# blanco (contraste y separación de colores validados en ese modo).
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f3"
textColor = "#0b0b0b"

[server]
headless = true

[browser]
gatherUsageStats = false
